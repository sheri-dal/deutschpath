const levels=[{id:'A1.1',name:'Getting Started',desc:'Greetings, introductions and everyday words'},{id:'A1.2',name:'Everyday Life',desc:'Shopping, daily routines, travel and conversations'},{id:'A2.1',name:'Improving Your German',desc:'Talking about the past and daily life'},{id:'A2.2',name:'Real-Life Conversations',desc:'Plans, comparisons and sentence building'},{id:'B1',name:'Speaking Independently',desc:'Opinions, stories and workplace German'},{id:'B2',name:'Advanced German',desc:'Arguments, in-depth discussions and complex grammar'}];
// Original sample curriculum, not copied from any textbook.
const raw=[
['A1.1','Hallo!','Greetings & introductions','Ich heiße Sara.','Mera naam Sara hai.','Use “Ich heiße …” for your name. “Wie heißt du?” means “Tumhara naam kya hai?”','Hallo|Salam;Guten Morgen|Subah bakhair;Tschüss|Allah hafiz;Danke|Shukriya;Bitte|Meherbani / Koi baat nahi','Kya matlab hai “Danke” mean?','Thank you|Good night|Sorry',0],
['A1.1','Woher kommst du?','Countries & languages','Ich komme aus Indien.','Main Bharat se hoon.','“Ich komme aus …” tells where you come from. “Ich spreche Hindi” tells which language you speak.','Deutschland|Germany;Indien|India;die Sprache|language;sprechen|to speak','German mein kaise kahenge “I come from India”?','Ich komme aus Indien.|Ich bin Indien.|Ich habe Indien.',0],
['A1.1','Meine Familie','Family & possessives','Das ist meine Schwester.','Yeh meri behen hai.','“mein” and “meine” mean “my”. Use “meine” with feminine nouns such as “Schwester”.','die Mutter|mother;der Vater|father;der Bruder|brother;die Schwester|sister','Kya matlab hai “die Mutter” mean?','Mother|Father|Brother',0],
['A1.1','Zahlen und Uhrzeit','Numbers & time','Es ist acht Uhr.','Aath baje hain.','For a full hour say “Es ist … Uhr”. Numbers: eins, zwei, drei, vier, fünf.','eins|one;zwei|two;drei|three;die Uhr|clock / o’clock','Kya hai “zwei”?','Two|Three|One',0],
['A1.1','Im Café','Ordering & articles','Ich möchte einen Tee.','Mujhe ek chai chahiye.','“Ich möchte …” is a polite way to request something. “einen” is used with masculine accusative nouns such as “Tee”.','der Tee|tea;der Kaffee|coffee;das Wasser|water;die Rechnung|bill','Chai adab se kaise mangenge?','Ich möchte einen Tee.|Du Tee.|Ich bin Tee.',0],
['A1.2','Mein Tag','Daily routines','Ich stehe um sieben Uhr auf.','Main saat baje uthta/uthti hoon.','Separable verbs split in main clauses: “aufstehen” becomes “Ich stehe … auf”.','aufstehen|to get up;frühstücken|to have breakfast;arbeiten|to work;schlafen|to sleep','Kaunsa lafz mukammal karta hai “Ich stehe um 7 Uhr ___”?','auf|an|ein',0],
['A1.2','In der Stadt','Places & directions','Wo ist der Bahnhof?','Railway station kahan hai?','Use “Wo ist …?” to ask where something is. “links” means left and “rechts” means right.','der Bahnhof|station;links|left;rechts|right;geradeaus|straight ahead','Kya matlab hai “geradeaus” mean?','Straight ahead|Left|Behind',0],
['A1.2','Einkaufen','Shopping & prices','Wie viel kostet das?','Yeh kitne ka hai?','Use “Wie viel kostet …?” to ask the price of one item.','kaufen|to buy;teuer|expensive;billig|cheap;das Geld|money','Kya matlab hai “teuer” mean?','Expensive|Cheap|Free',0],
['A1.2','Termine','Appointments & modal verbs','Ich kann morgen kommen.','Main kal aa sakta/sakti hoon.','With modal verbs such as “können”, the second verb goes to the end in infinitive form.','können|can / able to;müssen|must;morgen|tomorrow;der Termin|appointment','Mukammal karein: “Ich kann morgen ___.”','kommen|komme|kommt',0],
['A1.2','Meine Wohnung','Rooms & furniture','Die Lampe steht auf dem Tisch.','Lamp mez par rakha hai.','“auf dem” describes a fixed location on a masculine/neuter noun in the dative case.','die Küche|kitchen;das Zimmer|room;der Tisch|table;das Bett|bed','Kya matlab hai “die Küche” mean?','Kitchen|Bedroom|Door',0],
['A2.1','Gestern','Perfect tense','Ich habe Deutsch gelernt.','Maine German seekhi.','The conversational past often uses “haben/sein + Partizip II”. “lernen” becomes “gelernt”.','gestern|yesterday;gelernt|learned;gemacht|done;besucht|visited','Mukammal karein: “Ich habe Deutsch ___.”','gelernt|lernen|lerne',0],
['A2.1','Unterwegs','Travel & movement','Ich bin nach Berlin gefahren.','Main Berlin gaya/gayi tha/thi.','Many verbs of movement use “sein” in the Perfekt: “ich bin gefahren”.','fahren|to travel by vehicle;ankommen|to arrive;der Zug|train;die Reise|journey','Kaunsa helping verb sahi hai: “Ich ___ gefahren”?','bin|habe|werde',0],
['A2.1','Gesund bleiben','Health vocabulary','Mir geht es heute besser.','Aaj meri tabiyat behtar hai.','“Mir geht es …” describes how you feel. “besser” is the comparative of “gut”.','der Arzt|doctor;krank|ill;gesund|healthy;besser|better','Kya matlab hai “krank” mean?','Ill|Healthy|Hungry',0],
['A2.1','Weil …','Giving reasons','Ich lerne Deutsch, weil ich hier arbeite.','Main German seekhta/seekhti hoon kyunki main yahan kaam karta/karti hoon.','After “weil”, the conjugated verb goes to the end of its subordinate clause.','weil|because;deshalb|therefore;wichtig|important;der Grund|reason','Sahi jawab chunein ending after “weil ich hier …”','arbeite|ich arbeite|arbeiten',0],
['A2.1','Im Restaurant','Requests & polite questions','Könnten Sie mir bitte helfen?','Kya aap meri madad kar sakte hain?','“Könnten Sie …?” is a polite formal request. “Sie” is capitalized when addressing someone formally.','bestellen|to order;die Speisekarte|menu;lecker|tasty;bezahlen|to pay','Kaunsi guzarish adab se hai?','Könnten Sie mir helfen?|Hilfst du jetzt!|Du helfen.',0],
['A2.2','Zukunftspläne','Future & intentions','Ich werde nächstes Jahr reisen.','Main agle saal safar karunga/karungi.','Future with “werden + infinitive”: the infinitive stays at the end. Present tense with a time word is also common.','die Zukunft|future;planen|to plan;nächstes Jahr|next year;das Ziel|goal','Mukammal karein: “Ich werde morgen ___.”','lernen|lerne|gelernt',0],
['A2.2','Vergleiche','Comparative & superlative','Der Zug ist schneller als der Bus.','Train bus se tez hai.','Use comparative adjective + “als” to compare two things: “schneller als”.','schnell|fast;langsam|slow;größer|bigger;am besten|best','Kya matlab hai “schneller” mean?','Faster|Slower|Smallest',0],
['A2.2','Wenn ich Zeit habe','Conditions','Wenn ich Zeit habe, komme ich.','Agar mere paas waqt hua, main aaunga/aaungi.','“wenn” starts a subordinate clause with the verb at the end; the following main clause starts with its verb.','wenn|if / when;die Zeit|time;frei|free;vielleicht|perhaps','Choose correct: “Wenn ich Zeit ___, komme ich.”','habe|haben|hat',0],
['A2.2','Wohnen und Leben','Adjective endings','Ich suche eine kleine Wohnung.','Main ek chhota flat dhoondh raha/rahi hoon.','Adjectives before nouns take endings. After “eine”, feminine accusative uses “-e”: “eine kleine Wohnung”.','die Wohnung|apartment;ruhig|quiet;hell|bright;die Miete|rent','Mukammal karein: “eine klein___ Wohnung”','e|en|er',0],
['A2.2','Bei der Arbeit','Work communication','Ich interessiere mich für die Stelle.','Mujhe is naukri mein dilchaspi hai.','“sich interessieren für” is a reflexive expression followed by the accusative.','die Stelle|job position;die Bewerbung|application;die Erfahrung|experience;das Gespräch|conversation','Kaunsa preposition aata hai “interessiere mich”?','für|mit|von',0],
['B1','Meine Meinung','Expressing opinions','Meiner Meinung nach ist das sinnvoll.','Meri rai mein yeh samajhdari hai.','Use “Meiner Meinung nach …” to express an opinion. The finite verb follows the introductory phrase.','die Meinung|opinion;sinnvoll|sensible;zustimmen|to agree;ablehnen|to reject','Kya matlab hai “zustimmen” mean?','Ittefaq karna|Bhoolna|Shikayat karna',0],
['B1','Obwohl …','Concession clauses','Obwohl es regnet, gehe ich spazieren.','Baarish ke bawajood main sair par jaata/jaati hoon.','“obwohl” means although and sends the conjugated verb to the end of the subordinate clause.','obwohl|although;trotzdem|nevertheless;der Regen|rain;spazieren|to stroll','Mukammal karein: “Obwohl es ___, gehe ich raus.”','regnet|regnen|Regen',0],
['B1','Erfahrungen erzählen','Narrating events','Als ich klein war, lebte ich in Delhi.','Jab main chhota/chhoti tha/thi, Delhi mein rehta/rehti tha/thi.','Use “als” for a one-time period/event in the past; “wenn” is used for repeated past events.','damals|back then;früher|formerly;erleben|to experience;die Erinnerung|memory','Which word is used for a one-time past event?','als|wenn|weil',0],
['B1','Relativsätze','Relative clauses','Das ist der Mann, der hier arbeitet.','Yeh woh aadmi hai jo yahan kaam karta hai.','A relative clause adds information about a noun. The relative pronoun takes its case from its role in the clause.','der Mann|man;die Frau|woman;erklären|to explain;kennen|to know','Mukammal karein: “Das ist der Mann, ___ hier arbeitet.”','der|den|dem',0],
['B1','Formelle E-Mails','Formal writing','Ich freue mich auf Ihre Rückmeldung.','Mujhe aapke jawab ka intezar rahega.','Formal emails often use “Sehr geehrte …” at the start and “Mit freundlichen Grüßen” at the end.','die Rückmeldung|reply / feedback;die Anfrage|inquiry;mitteilen|to inform;freundlich|friendly','Formal email ka sahi ikhtitam kya hai?','Mit freundlichen Grüßen|Bis später|Na dann',0],
['B2','Argumentieren','Building an argument','Einerseits ist es praktisch, andererseits ist es teuer.','Ek taraf yeh aasan hai, doosri taraf mehnga hai.','“einerseits … andererseits …” contrasts two sides of an argument. Give a claim and a supporting reason.','einerseits|on one hand;andererseits|on the other hand;die Behauptung|claim;der Beleg|evidence','Kis ke saath aata hai “einerseits”?','andererseits|außerdem|deswegen',0],
['B2','Passiv','Passive voice','Der Vertrag wird unterschrieben.','Contract par dastakhat kiye ja rahe hain.','Present passive uses “werden + Partizip II”. The focus is on the action or its recipient.','unterschreiben|to sign;der Vertrag|contract;bearbeiten|to process;die Entscheidung|decision','Mukammal karein: “Der Vertrag ___ unterschrieben.”','wird|hat|ist',0],
['B2','Konjunktiv II','Hypothetical situations','Wenn ich mehr Zeit hätte, würde ich reisen.','Agar mere paas zyada waqt hota, main safar karta/karti.','Konjunktiv II expresses hypothetical or unreal situations. “würde + infinitive” is common.','hätte|would have;wäre|would be;würde|would;die Möglichkeit|possibility','Mukammal karein: “Wenn ich Zeit ___, würde ich reisen.”','hätte|habe|hatte',0],
['B2','Nominalisierung','Academic & formal style','Die Verbesserung der Qualität ist wichtig.','Quality mein sudhaar zaroori hai.','Formal German often uses nouns in place of verb phrases: “verbessern” → “die Verbesserung”.','die Verbesserung|improvement;die Entwicklung|development;die Voraussetzung|prerequisite;die Maßnahme|measure','Which noun comes from “verbessern”?','die Verbesserung|der Vergleich|die Verbindung',0],

onclick="flipped=!flipped;render('lesson')" onkeydown="if(event.key==='Enter'){flipped=!flipped;render('lesson')}"><b>${esc(flipped?w[1]:w[0])}</b><small>${flipped?'Meaning':'German · Tap to flip'}</small></div><div class="actions"><button class="secondary" onclick="flash=(flash+3)%4;flipped=false;render('lesson')">← Previous</button><button class="primary dark" onclick="flash=(flash+1)%4;flipped=false;render('lesson')">Next Card →</button><button class="secondary" onclick="tab='quiz';render('lesson')">Take Quiz</button></div>`}if(tab==='quiz')el.innerHTML=`<h3>Practice Quiz</h3><p>${esc(x.question)}</p>${x.options.map((o,i)=>`<button class="quizopt ${selected===i?'selected':''} ${checked&&i===x.answer?'correct':''} ${checked&&selected===i&&i!==x.answer?'wrong':''}" onclick="selected=${i};checked=false;render('lesson')">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}${checked?`<p class="feedback" style="color:${selected===x.answer?'#0d9e79':'#c74747'}">${selected===x.answer?'✓ Correct! Well done!':'Not quite. Try again and choose the correct answer.'}</p>`:''}<div class="actions"><button class="primary dark" onclick="checkAnswer()" ${selected===null?'disabled':''}>Check Answer</button>${checked&&selected===x.answer?`<button class="secondary" onclick="completeLesson()">✓ Complete Lesson</button>`:''}</div>`}

const listeningBank=[{level:'A1.1',de:'Ich heiße Maria.',q:'What did the speaker say?',options:['My name is Maria.','I live in Berlin.','I am tired.'],answer:0,ur:'“Ich heiße Maria” ka matlab hai “Mera naam Maria hai.”',en:'Ich heiße means my name is.'},{level:'A1.2',de:'Der Zug fährt um acht Uhr.',q:'When does the train leave?',options:['At seven','At eight','At nine'],answer:1,ur:'“acht Uhr” ka matlab aath bajay hai.',en:'Acht Uhr means eight o’clock.'},{level:'A2.1',de:'Gestern habe ich Deutsch gelernt.',q:'When did the person study German?',options:['Tomorrow','Today','Yesterday'],answer:2,ur:'“Gestern” ka matlab kal (guzra hua din) hai.',en:'Gestern means yesterday.'},{level:'B1',de:'Obwohl es regnet, gehe ich spazieren.',q:'What is happening?',options:['The speaker goes for a walk despite rain.','The speaker stays home.','The weather is sunny.'],answer:0,ur:'“Obwohl” ka matlab halaanke hai. Baarish ke bawajood walk kar raha hai.',en:'Obwohl means although; the speaker walks despite the rain.'}];
function listeningPage(){let q=listeningBank[listenIndex];$('app').innerHTML=`<h1 class="lessonTitle">Listening Practice</h1><p class="subtitle">Listen to German sentences and answer comprehension questions.</p><div class="practicebox"><div class="extra-top"><span class="levelbadge">${q.level}</span><span class="small-muted">Audio ${listenIndex+1} of ${listeningBank.length}</span></div><p><button class="primary dark" onclick="speak(listeningBank[listenIndex].de)">🔊 Play German Audio</button> <button class="secondary" onclick="speak(listeningBank[listenIndex].de)">↻ Replay</button></p><h2>${esc(q.q)}</h2>${q.options.map((o,i)=>`<button class="quizopt ${listenSelected===i?'selected':''}" ${listenResult?'disabled':''} onclick="listenSelected=${i};listeningPage()">${esc(o)}</button>`).join('')}${listenResult?quizFeedback(q,listenSelected,listenSelected===q.answer):''}<div class="actions">${!listenResult?`<button class="primary dark" ${listenSelected===null?'disabled':''} onclick="submitListening()">Check Answer</button>`:`<button class="primary dark" onclick="listenIndex=(listenIndex+1)%listeningBank.length;listenSelected=null;listenResult=false;listeningPage()">Next Audio →</button>`}</div></div><p class="note">Audio uses your browser's German text-to-speech voice. Sound quality and availability depend on your device. This is a starter listening set.</p>`}
function submitListening(){if(listenSelected===null||listenResult)return;listenResult=true;let q=listeningBank[listenIndex];if(listenSelected!==q.answer)study.mistakes['listening-'+listenIndex]=(study.mistakes['listening-'+listenIndex]||0)+1;else{study.listeningCorrect++;delete study.mistakes['listening-'+listenIndex]}recordActivity();listeningPage()}
const chatPrompts=[{de:'Hallo! Wie heißt du?',ur:'Salam! Tumhara naam kya hai?',example:'Ich heiße Ali.',keywords:['ich heiße','mein name ist']},{de:'Woher kommst du?',ur:'Tum kahan se ho?',example:'Ich komme aus Pakistan.',keywords:['ich komme aus']},{de:'Wo wohnst du?',ur:'Tum kahan rehte ho?',example:'Ich wohne in Nürnberg.',keywords:['ich wohne in']},{de:'Was machst du gern?',ur:'Tumhein kya karna pasand hai?',example:'Ich lerne gern Deutsch.',keywords:['ich','gern']}];
let chatHistory=[];
function conversationPage(){let q=chatPrompts[chatStep%chatPrompts.length];$('app').innerHTML=`<h1 class="lessonTitle">Conversation Practice</h1><p class="subtitle">Guided German conversation · offline starter mode</p><div class="warning">This is a scripted practice partner, not live AI. It checks a few common answer patterns; it cannot fully correct your German.</div><div class="practicebox"><div class="chatline"><b>DeutschPath:</b> ${esc(q.de)} <button class="sound" onclick="speak(chatPrompts[chatStep%chatPrompts.length].de)">🔊</button><p class="small-muted">${esc(q.ur)}</p></div>${chatHistory.slice(-6).map(x=>`<div class="chatline mine"><b>You:</b> ${esc(x.input)}</div><div class="chatline"><b>Feedback:</b> ${esc(x.feedback)}</div>`).join('')}<form onsubmit="sendChat(event)" class="input-row"><input id="chatInput" autocomplete="off" maxlength="250" required placeholder="Write your answer in German…" aria-label="Your German reply"><button class="primary dark" type="submit">Send Reply</button></form><p class="small-muted">Example: ${esc(q.example)}</p><div class="actions"><button class="secondary" onclick="chatStep=(chatStep+1)%chatPrompts.length;conversationPage()">Skip Question →</button><button class="secondary" onclick="chatStep=0;chatHistory=[];conversationPage()">Restart</button></div></div>`}
function sendChat(event){event.preventDefault();let input=$('chatInput').value.trim();if(!input)return;let q=chatPrompts[chatStep%chatPrompts.length];let ok=q.keywords.some(k=>input.toLocaleLowerCase('de').includes(k));chatHistory.push({input,feedback:ok?'Good start! Jumla theek pattern par hai. Ab agla sawaal.':'Koshish achi hai! Is sample pattern ko dekhein: '+q.example+' (Yeh automatic grammar checking nahi hai.)'});if(ok)chatStep=(chatStep+1)%chatPrompts.length;recordActivity();conversationPage()}
function settingsPage(){$('app').innerHTML=`<h1 class="lessonTitle">Backup & Settings</h1><p class="subtitle">Keep your learning data safe and move it to another device manually.</p><div class="practicebox"><h2>Export Your Progress</h2><p>Download your completed lessons, practice history, streak and saved mistakes as a JSON backup file.</p><button class="primary dark" onclick="exportProgress()">⬇ Download Backup</button></div><div class="practicebox"><h2>Import a Backup</h2><p>Use a backup from another phone or laptop. This replaces your current progress on this device.</p><input type="file" accept=".json,application/json" id="backupFile"><button class="secondary" onclick="importProgress()">Import Backup</button></div><div class="practicebox"><h2>Cloud Sync & Login</h2><p>Not connected yet. To sync automatically across devices, we need to configure your own free Firebase project and its security rules. No passwords or API secrets are needed in this offline version.</p></div>`}
function exportProgress(){let data={format:'deutschpath-backup',version:2,completed,study,explanationLanguage,exportedAt:new Date().toISOString()};let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='deutschpath-backup.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function importProgress(){let f=$('backupFile').files[0];if(!f){alert('Choose a backup JSON file first.');return}try{if(f.size>2000000)throw Error('Backup file is too large');let d=JSON.parse(await f.text());if(d.format!=='deutschpath-backup'||d.version!==2||!Array.isArray(d.completed)||!d.study||typeof d.study!=='object'||!d.study.days||!d.study.mistakes)throw Error('Invalid DeutschPath backup');if(!confirm('Replace progress on this device with this backup?'))return;completed=[...new Set(d.completed.filter(x=>Number.isInteger(x)&&x>=0&&x<lessons.length))];study={days:d.study.days,mistakes:d.study.mistakes,grammarCorrect:Number(d.study.grammarCorrect)||0,listeningCorrect:Number(d.study.listeningCorrect)||0};save();persistStudy();alert('Backup imported successfully.');nav('home')}catch(e){alert('Import failed: '+e.message)}}
const originalRender=render;
render=function(page='home'){if(['grammar','mistakes','listening','conversation','settings'].includes(page)){document.getElementById('lang-ur').classList.toggle('active',explanationLanguage==='ur');document.getElementById('lang-en').classList.toggle('active',explanationLanguage==='en');document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===page));$('crumb').textContent=({grammar:'Grammar Practice',mistakes:'Mistake Review',listening:'Listening Practice',conversation:'Conversation Practice',settings:'Backup & Settings'})[page];if(page==='grammar')grammarPage();if(page==='mistakes')mistakePage();if(page==='listening')listeningPage();if(page==='conversation')conversationPage();if(page==='settings')settingsPage();return}originalRender(page);if(page==='home'){let t=todayLocal(),done=study.days[t]||0,goal=5;let section=document.createElement('section');section.innerHTML=`<div class="sectionhead"><h2>Your Daily Learning</h2><small>Offline progress</small></div><div class="stats"><div class="stat"><b>🔥 ${streak()}</b><small>Day Streak</small></div><div class="stat"><b>${Math.min(done,goal)}/${goal}</b><small>Daily Practice Goal</small><div class="daygoal" style="margin-top:10px"><span style="width:${Math.min(100,done/goal*100)}%"></span></div></div><div class="stat"><b>${Object.keys(study.mistakes).length}</b><small>Questions to Review</small></div></div><div class="sectionhead"><h2>Practice Zone</h2></div><div class="extra-grid">${[['grammar','✍️ Grammar Practice','Articles, verbs, cases and sentence structure'],['mistakes','↻ Mistake Review','Retry questions you missed'],['listening','🔊 Listening Practice','Hear German and check understanding'],['conversation','💬 Conversation Practice','Guided offline German dialogues'],['settings','💾 Backup & Settings','Export or import progress between devices']].map(([p,t,d])=>`<div class="feature"><h3>${t}</h3><p>${d}</p><button class="secondary" onclick="nav('${p}')">Open →</button></div>`).join('')}</div>`;let stats=$('app').querySelector('.stats');stats.after(section)}};
// Allow language switch to keep the selected practice page open.
setExplanationLanguage=function(lang){explanationLanguage=lang;localStorage.setItem('deutschpath-explanation-language',lang);let page=decodeURIComponent(location.hash.slice(1))||'home';render(current&&page.startsWith('lesson-')?'lesson':page)};
// Render initial page again with enhanced navigation and home widgets.
let initial=decodeURIComponent(location.hash.slice(1))||'home';render(initial.startsWith('lesson-')&&current?'lesson':initial);
</script></body></html>
